<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Code Catcher</title>
  <link rel="stylesheet" href="sidepanel.css">
  <script src="theme-boot.js"></script>
</head>
<body data-view="codes">
  <header class="bar" id="bar">
    <button class="nav-back" id="backBtn" type="button">
      <svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="backLabel">Codes</span>
    </button>
    <div class="title-row">
      <h1 class="large-title" id="title">Codes</h1>
      <div class="tools">
        <button class="tool" id="refreshBtn" type="button" title="Check now" aria-label="Check now">
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M16 10.2A6 6 0 1 1 14.2 5.8M14.6 2.6v3.6H11" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="tool" id="settingsBtn" type="button" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M16.02 8.14 L18.02 8.29 L18.02 11.71 L16.02 11.86 L15.93 12.12 L15.57 12.94 L16.88 14.46 L14.46 16.88 L12.94 15.57 L12.70 15.69 L11.86 16.02 L11.71 18.02 L8.29 18.02 L8.14 16.02 L7.88 15.93 L7.06 15.57 L5.54 16.88 L3.12 14.46 L4.43 12.94 L4.31 12.70 L3.98 11.86 L1.98 11.71 L1.98 8.29 L3.98 8.14 L4.07 7.88 L4.43 7.06 L3.12 5.54 L5.54 3.12 L7.06 4.43 L7.30 4.31 L8.14 3.98 L8.29 1.98 L11.71 1.98 L11.86 3.98 L12.12 4.07 L12.94 4.43 L14.46 3.12 L16.88 5.54 L15.57 7.06 L15.69 7.30Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="10" cy="10" r="2.7" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
        </button>
      </div>
    </div>
    <div class="subtitle" id="status" data-state="idle"><span class="dot"></span><span id="statusText"></span></div>
  </header>

  <main id="view"></main>

  <div id="hud" class="hud" role="status" aria-live="polite">
    <svg class="hud-check" viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><path d="m5 10.5 3.2 3.2L15 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span id="hudText"></span>
  </div>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
